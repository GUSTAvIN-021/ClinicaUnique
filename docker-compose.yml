services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unique
      POSTGRES_USER: unique
      POSTGRES_PASSWORD: unique_dev_only
    ports:
      - "5432:5432"
    volumes:
      - unique_postgres:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db]
    ports: ["8000:8000"]
    volumes:
      - ./imports:/imports:ro
    command: >
      sh -c "alembic upgrade head &&
      if [ -n \"$$SEED_ADMIN_PASSWORD\" ]; then python -m app.seed; fi &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  unique_postgres:
