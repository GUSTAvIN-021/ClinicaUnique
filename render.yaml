# Blueprint de produção para o Render.
# Os valores marcados como sync: false são preenchidos somente no painel do
# Render; eles nunca devem ser enviados para o GitHub.
databases:
  - name: unique-postgres
    databaseName: unique
    user: unique
    # Início econômico: pode ser aumentado no painel sem recriar o banco.
    plan: basic-256mb

services:
  - type: web
    name: unique-api
    runtime: docker
    # Mantém a API ligada continuamente; o plano gratuito entra em suspensão.
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unique-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: unique-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Preencher com a URL HTTPS gerada para unique-api, por exemplo:
      # https://unique-api.onrender.com
      - key: VITE_API_URL
        sync: false
