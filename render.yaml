# Blueprint de produção para o Render.
# Os valores marcados como sync: false são preenchidos somente no painel do
# Render; eles nunca devem ser enviados para o GitHub.
databases:
  - name: unique-postgres
    databaseName: unique
    user: unique
    # Início econômico: pode ser aumentado no painel sem recriar o banco.
    plan: basic-256mb

services:
  - type: web
    name: unique-api
    runtime: docker
    # Mantém a API ligada continuamente; o plano gratuito entra em suspensão.
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unique-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: unique-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # Mantém login e cookies no mesmo endereço do site. Esta regra deve vir
      # antes da regra do React abaixo.
      - type: rewrite
        source: /api/*
        destination: https://unique-api-zdce.onrender.com/api/*
      # Permite abrir ou atualizar qualquer tela do React diretamente.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api
